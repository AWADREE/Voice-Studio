<div class="clip-import">
<label>Source commentary<textarea class="clip-source" rows="6" placeholder="Paste your full script. Separate paragraphs with a blank line."></textarea></label>
<p class="clip-import-note">Starts at 00:05. Each following start adds 0.08 seconds per character from the preceding paragraph. Timing is an editable estimate.</p>
<button class="clip-split" type="button">Split into multiple clips</button>
<div class="clip-confirm" hidden><p>Replace your existing clips? Their text and timings will be replaced. Your source script stays here.</p><div class="clip-import-actions"><button class="clip-replace" type="button">Replace existing clips</button><button class="clip-cancel" type="button">Cancel</button></div></div>
<p class="clip-import-status" role="status" aria-live="polite" hidden></p>
<button class="clip-undo" type="button" hidden>Undo last import</button>
</div>
<div class="clip-list"></div><button type="button" class="clip-add">Add clip</button>
